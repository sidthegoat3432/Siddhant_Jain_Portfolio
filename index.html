<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Siddhant Portfolio — the work, skills, and services of Siddhant Jain, a builder and creative problem-solver."
  />
  <meta name="theme-color" content="#0b1220" />
  <meta property="og:title" content="Siddhant Portfolio" />
  <meta
    property="og:description"
    content="The work, skills, and services of Siddhant Jain, a builder and creative problem-solver."
  />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/og-card.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Siddhant Portfolio</title>
  <script>
    // Apply the saved theme before first paint so there's no flash.
    (function () {
      try {
        var t = localStorage.getItem("siddhant-theme");
        // Dark is the default; only skip it when the user explicitly chose light.
        if (t !== "light") document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>
</head>


<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
