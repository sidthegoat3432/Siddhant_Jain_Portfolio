<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#141F38"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#223350" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- top accent -->
  <rect x="0" y="0" width="1200" height="5" fill="#2DD4BF"/>

  <!-- decorative ring -->
  <circle cx="930" cy="330" r="215" fill="none" stroke="#2DD4BF" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="930" cy="330" r="175" fill="none" stroke="#2DD4BF" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 10"/>

  <!-- label -->
  <circle cx="88" cy="92" r="7" fill="#2DD4BF"/>
  <text x="108" y="100" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" letter-spacing="6" fill="#8FA3BF">PORTFOLIO — TORONTO, CANADA</text>

  <!-- name -->
  <text x="88" y="285" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="800" fill="#F5F1E8">Siddhant Jain</text>

  <!-- role -->
  <text x="90" y="365" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="600" fill="#2DD4BF">Builder &amp; creative problem-solver</text>

  <!-- bottom row -->
  <circle cx="88" cy="515" r="8" fill="#4ADE80"/>
  <text x="110" y="525" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#C7D2E0">Open to freelance &amp; full-time roles</text>
  <text x="1198" y="525" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="600" fill="#C7D2E0">siddhant0516@gmail.com</text>

  <!-- monogram watermark -->
  <text x="930" y="392" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" fill="#2DD4BF" fill-opacity="0.1">SJ</text>
</svg>
